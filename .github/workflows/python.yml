name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - 'models/**/*.py'
      - 'pixi.toml'
      - 'pixi.lock'

  pull_request:
    branches:
      - main
    paths:
      - 'models/**/*.py'
      - 'pixi.toml'
      - 'pixi.lock'

  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true

      - name: Lint
        run: pixi run lint

  typecheck-model-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true

      - name: Typecheck model source
        run: pixi run ty check models/factorio-yolo-v0/src
