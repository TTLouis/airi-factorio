name: CI

on:
  push:
    branches:
      - main
      - feat/npc-transition-work
      - feat/swarm-pterodactyl-playable

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-typescript:
    if: github.ref != 'refs/heads/feat/swarm-pterodactyl-playable' && github.head_ref != 'feat/swarm-pterodactyl-playable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Lint
        run: pnpm run lint

  lint-python:
    if: github.ref != 'refs/heads/feat/swarm-pterodactyl-playable' && github.head_ref != 'feat/swarm-pterodactyl-playable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
      - name: Lint
        run: pixi run lint

  typecheck-typescript:
    if: github.ref != 'refs/heads/feat/swarm-pterodactyl-playable' && github.head_ref != 'feat/swarm-pterodactyl-playable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Typecheck
        run: pnpm run build && pnpm run typecheck
      - name: Compile native NPC Pterodactyl guard
        run: |
          node deploy/pterodactyl/staging/source-preparer.mjs . deploy/pterodactyl/staging/guard.ts
          pnpm --filter autorio.ts run typecheck
          pnpm --filter autorio.ts run build

  typecheck-python:
    if: github.ref != 'refs/heads/feat/swarm-pterodactyl-playable' && github.head_ref != 'feat/swarm-pterodactyl-playable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
      - name: Typecheck
        run: pixi run typecheck

  test-typescript:
    if: github.ref != 'refs/heads/feat/swarm-pterodactyl-playable' && github.head_ref != 'feat/swarm-pterodactyl-playable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Test
        run: pnpm run test

  pterodactyl-swarm-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check generated swarm egg artifacts
        run: node deploy/pterodactyl/build-payload.mjs --check
      - name: Test swarm payload verifier
        run: node --test deploy/pterodactyl/build-payload.test.mjs
      - name: Test swarm Pterodactyl infrastructure
        run: |
          node --test deploy/pterodactyl/staging/guard.test.mjs deploy/pterodactyl/staging/source-preparer.test.mjs deploy/pterodactyl/staging/swarm-ui-policy.test.mjs
          node --test deploy/pterodactyl/runtime-v8/child-input.test.mjs deploy/pterodactyl/runtime-v8/config-authority.test.mjs deploy/pterodactyl/runtime-v8/game-files.test.mjs

  swarm-factorio-integration:
    if: github.ref == 'refs/heads/feat/swarm-pterodactyl-playable' || github.head_ref == 'feat/swarm-pterodactyl-playable'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run swarm Factorio harness lane
        run: docker build -f tests/factorio/Dockerfile -t airi-factorio-swarm-test . && docker run --rm -e NPC_TEST_LANES=swarm airi-factorio-swarm-test
