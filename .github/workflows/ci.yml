name: CI

on:
  push:
    branches:
      - main
      - feat/npc-transition-work

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm run build && pnpm run typecheck

      - name: Reject raw JavaScript slice calls in generated Lua
        run: |
          if grep -n ':slice(' packages/autorio/dist/control.lua; then
            echo 'Generated Lua contains a raw JavaScript .slice() method call; use typed/Lua-safe iteration instead.'
            exit 1
          fi

      - name: Compile native NPC Pterodactyl guard
        run: |
          node deploy/pterodactyl/staging/source-preparer.mjs . deploy/pterodactyl/staging/guard.ts
          pnpm --filter autorio.ts run typecheck
          pnpm --filter autorio.ts run build

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Test
        run: pnpm run test

  pterodactyl-npc-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check generated egg artifacts
        run: |
          sha256sum deploy/pterodactyl/payload-src/installer.sh
          node deploy/pterodactyl/build-payload.mjs --check

      - name: Test payload verifier portability
        run: node --test deploy/pterodactyl/build-payload.test.mjs

      - name: Test standalone-NPC deployment protocol and production runtime
        run: node --test --test-force-exit deploy/pterodactyl/staging/*.test.mjs deploy/pterodactyl/runtime-v8/*.test.mjs
